<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "secondary-container": "#d1e1f7",
              "on-surface": "#1a1c1c",
              "on-background": "#1a1c1c",
              "surface-container-high": "#e8e8e8",
              "on-secondary": "#ffffff",
              "error": "#ba1a1a",
              "primary-fixed-dim": "#a0cafc",
              "primary-fixed": "#d1e4ff",
              "on-tertiary-fixed": "#2a1800",
              "surface-container": "#eeeeee",
              "tertiary-container": "#6a4300",
              "primary-container": "#1f4e79",
              "error-container": "#ffdad6",
              "surface-bright": "#f9f9f9",
              "surface-dim": "#dadada",
              "surface-container-highest": "#e2e2e2",
              "tertiary-fixed-dim": "#f5bc72",
              "surface-container-low": "#f3f3f3",
              "on-primary-container": "#95bff1",
              "outline": "#72777f",
              "surface": "#f9f9f9",
              "surface-container-lowest": "#ffffff",
              "on-secondary-fixed-variant": "#39485a",
              "secondary-fixed": "#d4e4fa",
              "outline-variant": "#c2c7d0",
              "on-secondary-fixed": "#0d1d2d",
              "on-tertiary-container": "#e9b268",
              "on-tertiary-fixed-variant": "#643f00",
              "on-error": "#ffffff",
              "secondary": "#516072",
              "on-secondary-container": "#556477",
              "on-primary-fixed-variant": "#184974",
              "on-primary": "#ffffff",
              "on-error-container": "#93000a",
              "secondary-fixed-dim": "#b8c8de",
              "tertiary": "#4c2e00",
              "inverse-primary": "#a0cafc",
              "primary": "#00375e",
              "inverse-surface": "#2f3131",
              "surface-tint": "#35618d",
              "tertiary-fixed": "#ffddb5",
              "surface-variant": "#e2e2e2",
              "on-tertiary": "#ffffff",
              "inverse-on-surface": "#f1f1f1",
              "on-surface-variant": "#42474f",
              "background": "#f9f9f9",
              "on-primary-fixed": "#001d35"
            },
            fontFamily: {
              "headline": ["Inter", "sans-serif"],
              "body": ["Inter", "sans-serif"],
              "label": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.375rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9f9f9;
        }
        .editorial-shadow {
            box-shadow: 0 12px 32px -4px rgba(0, 55, 94, 0.08);
        }
        .ghost-border {
            border: 1px solid rgba(194, 199, 208, 0.3);
        }
        .primary-gradient {
            background: linear-gradient(135deg, #00375e 0%, #1f4e79 100%);
        }
    </style>
</head>
<body class="antialiased text-on-surface m-0 p-0 overflow-hidden">
<!-- Auth Shell Suppression: TopAppBar and Footer are suppressed for transactional login screen as per instructions -->
<main class="flex min-h-screen w-full">
<!-- Left Half: Deep Navy Branding -->
<section class="hidden md:flex md:w-1/2 bg-primary-container relative items-center justify-center p-12 overflow-hidden">
<!-- Background Texture for Architectural Curator Feel -->
<div class="absolute inset-0 opacity-10 pointer-events-none">
<div class="absolute top-0 left-0 w-full h-full" data-alt="Abstract geometric architectural patterns with subtle lighting and clean lines in deep blue tones" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDFsOA9FivRCfS-0lrkl6nIKb3l5fjT-JHoIZXkaYIXnjMEcDyDKpDYrhAWriJKfEl2H1-0iXVGQc0dLMT-XGoLQ-J-ygJeTsdXu0cruf-iG7HYnl0NMd8K36ReJLDh9Fnsxk1j0y6ihRrMWP4rq1_Fu2qle-V-bwYMzBw--0tt1wN-3hYWsDZDZRD-VacIxTquVs7QfBwbfHlzbapeTQt0FjkA6ovRWUXMYBov1LvAubhJIGMN4YQTtucdX_oI5EsrejdptnjpPmaw'); background-size: cover; mix-blend-mode: overlay;"></div>
</div>
<div class="relative z-10 text-center flex flex-col items-center">
<!-- SGRH Logo Placeholder/Icon -->
<div class="mb-8 p-4 rounded-xl bg-white/10 backdrop-blur-md inline-flex items-center justify-center">
<span class="material-symbols-outlined text-white text-6xl" style="font-variation-settings: 'FILL' 1;">corporate_fare</span>
</div>
<h1 class="text-white text-5xl font-extrabold tracking-tight mb-4">
                    SGRH
                </h1>
<p class="text-on-primary-container text-xl font-medium max-w-md leading-relaxed opacity-90">
                    Sistema de Gestión de Recursos Humanos
                </p>
<!-- Editorial Spatial Detail -->
<div class="mt-24 flex items-center gap-4 text-primary-fixed-dim/40">
<div class="h-[1px] w-12 bg-current"></div>
<span class="text-[10px] uppercase tracking-[0.2em] font-bold">Arquitectura de Talento</span>
<div class="h-[1px] w-12 bg-current"></div>
</div>
</div>
</section>
<!-- Right Half: Login Form -->
<section class="w-full md:w-1/2 bg-surface-container-lowest flex items-center justify-center p-8 md:p-16 lg:p-24">
<div class="w-full max-w-md">
<!-- Mobile Logo (Only visible on small screens) -->
<div class="md:hidden flex items-center gap-3 mb-12">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'FILL' 1;">corporate_fare</span>
<div>
<h2 class="text-primary font-bold text-xl leading-none">SGRH</h2>
<p class="text-[10px] text-on-surface-variant uppercase tracking-wider">Gestión de RRHH</p>
</div>
</div>
<div class="mb-10">
<h2 class="text-3xl font-bold text-on-surface tracking-tight mb-2">Bienvenido de nuevo</h2>
<p class="text-on-surface-variant text-sm">Ingrese sus credenciales para acceder al sistema.</p>
</div>
<form class="space-y-6">
<!-- Email Input -->
<div class="space-y-2">
<label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant ml-1" for="email">
                            Correo electrónico
                        </label>
<div class="relative">
<input class="w-full h-14 px-4 bg-surface-container-low ghost-border rounded-lg text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary-fixed-dim focus:bg-white transition-all duration-200" id="email" placeholder="nombre@empresa.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-2">
<div class="flex justify-between items-end">
<label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant ml-1" for="password">
                                Contraseña
                            </label>
</div>
<div class="relative">
<input class="w-full h-14 px-4 bg-surface-container-low ghost-border rounded-lg text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-2 focus:ring-primary-fixed-dim focus:bg-white transition-all duration-200" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Login Button -->
<div class="pt-4">
<button class="w-full h-14 primary-gradient text-white font-bold rounded-lg editorial-shadow active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2 group" type="submit">
<span>Iniciar sesión</span>
<span class="material-symbols-outlined text-lg group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="text-center pt-2">
<a class="text-[13px] font-medium text-on-surface-variant hover:text-primary transition-colors underline-offset-4 hover:underline" href="#">
                            Olvidé mi contraseña
                        </a>
</div>
</form>
<!-- Editorial Footer Detail -->
<div class="mt-20 flex flex-col gap-6">
<div class="h-[1px] w-full bg-outline-variant/20"></div>
<div class="flex justify-between items-center text-[10px] text-outline font-medium uppercase tracking-widest">
<span>SGRH © 2024</span>
<div class="flex gap-4">
<a class="hover:text-primary transition-colors" href="#">Soporte</a>
<a class="hover:text-primary transition-colors" href="#">Privacidad</a>
</div>
</div>
</div>
</div>
</section>
</main>
</body></html>
